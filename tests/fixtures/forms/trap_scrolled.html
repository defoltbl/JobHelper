<!doctype html>
<html><head><meta charset="utf-8"><title>Junior Analyst - Fabrikam Careers</title>
<style>
  * { transition: all 0.3s; }               /* a theme that animates everything: no box is fading in by it */
  body { height: 3000px; }
  form { position: absolute; top: 800px; left: 20px; }
</style></head>
<body>
<!-- a box just above the top of the page: the page is scrolled down, so it is on screen in no way a person can see -->
<input id="hp1" type="email" name="email_check" style="position:absolute; top:-500px; left:20px" aria-label="Email">
<form action="/never-sent" onsubmit="window.sent = true; return false;">
  <label for="fn">First name</label><input id="fn" name="first_name">
  <label for="em">Email</label><input id="em" type="email" name="email">
  <div style="opacity:0"><label for="hp2">Phone</label><input id="hp2" type="tel" name="phone_check"></div>
  <label for="hp3">City</label><input id="hp3" role="combobox" name="city" style="opacity:0">
  <div id="host" style="opacity:0"></div>
</form>
<script>
  document.getElementById('host').attachShadow({mode: 'open'}).innerHTML = '<label for="hp4">Last name</label><input id="hp4" name="last_name">';
  window.scrollTo(0, 600);
</script>
</body></html>
