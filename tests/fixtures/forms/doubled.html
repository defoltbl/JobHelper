<!doctype html>
<html><head><meta charset="utf-8"><title>Apply | Larkfield</title>
<style>body{font:14px sans-serif;max-width:640px;margin:24px auto} label{display:block} input[type=text]{width:100%}</style></head>
<body>
<form id="f" onsubmit="return false;">
  <p><label for="fn">First name</label><input type="text" id="fn" name="first_name" value="Alex"></p>
  <fieldset><legend>Can you work remotely?</legend>
    <label><input type="radio" name="remote" id="ry" value="yes"> Yes</label>
    <label><input type="radio" name="remote" id="rn" value="no"> No</label></fieldset>
  <p><label for="cv">Your CV</label><input type="file" id="cv" name="cv"></p>
</form>
</body></html>
