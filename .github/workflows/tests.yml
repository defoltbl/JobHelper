# Runs the checks of README "Testing" on every push and pull request: pyflakes, then the whole test suite.
# macOS, because the app is a Mac app (Keychain, Qt Quick off-screen, the bundled Claude program).
# The tests are offline: they never ask Claude, read a job board or a mailbox, or touch a real Keychain.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run: only its latest commit counts for the
# "Protect main" ruleset, and an outdated run would hold one of the few Mac runners. Each run on main has a group
# of its own (its run id), so a run on main is never cancelled or replaced, also when merges come close together.
concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install the exact, hash-checked packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install "pyflakes==4.0.2"

      - name: Pyflakes
        run: python -m pyflakes jobhelper tests scripts app_qt.py run.py status.py

      - name: Tests
        run: python -m pytest
        env:
          PYTEST_ADDOPTS: --junitxml=test-report.xml

      # The log needs a sign-in; annotations and the run summary do not. So each failed test is shown there too.
      - name: Show failed tests on the run page
        if: failure()
        run: |
          python - <<'EOF'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("test-report.xml"):
              raise SystemExit(0)
          lines = ["## Failed tests", ""]
          for case in ET.parse("test-report.xml").iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  name = f"{case.get('classname')}::{case.get('name')}"
                  why = (bad.get("message") or "").replace("\n", " ")[:300]
                  print(f"::error title={name}::{why}")
                  lines.append(f"- `{name}`: {why}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("\n".join(lines) + "\n")
          EOF
